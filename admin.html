<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
addDoc,
updateDoc,
deleteDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
 FIREBASE
===================================================== */

const firebaseConfig={

apiKey:"PASTE_YOUR_FIREBASE_API_KEY",

authDomain:"PASTE_YOUR_PROJECT.firebaseapp.com",

projectId:"PASTE_YOUR_PROJECT_ID",

storageBucket:"PASTE_YOUR_PROJECT.firebasestorage.app",

messagingSenderId:"PASTE_YOUR_SENDER_ID",

appId:"PASTE_YOUR_APP_ID"

};


/* নিজের Admin Gmail এখানে বসাবে */

const ADMIN_EMAIL=
"PASTE_ADMIN_GMAIL_HERE";


const firebaseReady=
!firebaseConfig.apiKey.startsWith("PASTE_");


let auth=null;
let db=null;

if(firebaseReady){

const app=initializeApp(firebaseConfig);

auth=getAuth(app);

db=getFirestore(app);

}


const groups=[
"A+","A-","B+","B-",
"AB+","AB-","O+","O-"
];


let donors=[];
let requests=[];
let currentPage="dashboard";

const GEO_URL=
"https://raw.githubusercontent.com/open-admin-data/bangladesh-administrative-divisions/main/data/hierarchy.json";

let geo=[];


const $=id=>document.getElementById(id);


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}


function toast(msg){

$("toast").textContent=msg;

$("toast").classList.add("show");

setTimeout(()=>{
$("toast").classList.remove("show");
},2500);

}


/* =====================================================
 LOCATION
===================================================== */

async function loadGeo(){

const res=await fetch(GEO_URL);

const json=await res.json();

const source=
Array.isArray(json)?json:(json.data||[]);

geo=source.map(div=>({

en:div.name?.en||div.name,
bn:div.name?.local||div.name?.en||div.name,

districts:
(div.district||div.districts||div.children||[])
.map(d=>({

en:d.name?.en||d.name,
bn:d.name?.local||d.name?.en||d.name,

upazilas:
(d.upazila||d.upazilas||d.children||[])
.map(u=>({

en:u.name?.en||u.name,
bn:u.name?.local||u.name?.en||u.name

}))

}))

}));

const d=geo.reduce(
(a,x)=>a+x.districts.length,0);

const u=geo.reduce(
(a,x)=>a+x.districts.reduce(
(b,y)=>b+y.upazilas.length,0),0);

if(geo.length!==8||d!==64||u!==495){

throw new Error("Location data is not 8/64/495");

}

}


/* =====================================================
 DATA
===================================================== */

async function loadData(){

if(db){

const ds=await getDocs(
collection(db,"donors")
);

donors=ds.docs.map(
x=>({id:x.id,...x.data()})
);

const rs=await getDocs(
collection(db,"requests")
);

requests=rs.docs.map(
x=>({id:x.id,...x.data()})
);

}else{

donors=JSON.parse(
localStorage.getItem("mb_demo_donors")||"[]");

requests=JSON.parse(
localStorage.getItem("mb_demo_requests")||"[]");

}

updateStats();

render();

}


function updateStats(){

$("pendingDonors").textContent=
donors.filter(x=>x.status==="pending").length;

$("approvedDonors").textContent=
donors.filter(x=>x.status==="approved").length;

$("rejectedDonors").textContent=
donors.filter(x=>x.status==="rejected").length;

$("allRequests").textContent=requests.length;

$("totalDonors").textContent=donors.length;

}


/* =====================================================
 SIDEBAR
===================================================== */

document.querySelectorAll(".sideBtn")
.forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".sideBtn")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

currentPage=btn.dataset.page;

render();

};

});


/* =====================================================
 RENDER
===================================================== */

function render(){

if(currentPage==="dashboard")
dashboard();

else if(
["pending","approved","rejected"].includes(currentPage)
)
donorList(currentPage);

else if(currentPage==="requests")
requestList();

else if(currentPage==="addDonor")
addDonorPage();

else if(currentPage==="addRequest")
addRequestPage();

else if(currentPage==="search")
searchPage();

else if(currentPage==="locations")
locationPage();

}

===================================================== */

/* =====================================================
 LOCATION FIELDS
===================================================== */

function locationHTML(prefix){

return `

<div>

<label>বিভাগ</label>

<select id="${prefix}Div"
onchange="setDistrict('${prefix}')">

<option value="">
বিভাগ নির্বাচন
</option>

${geo.map(d=>`

<option value="${esc(d.en)}">
${esc(d.bn)} (${esc(d.en)})
</option>

`).join("")}

</select>

</div>

<div>

<label>জেলা</label>

<select id="${prefix}Dist"
onchange="setUpazila('${prefix}')">

<option value="">
জেলা নির্বাচন
</option>

</select>

</div>

<div>

<label>উপজেলা</label>

<select id="${prefix}Upa">

<option value="">
উপজেলা নির্বাচন
</option>

</select>

</div>

`;


}


window.setDistrict=prefix=>{

const div=geo.find(
x=>x.en===$(prefix+"Div").value);

$(prefix+"Dist").innerHTML=
'<option value="">জেলা নির্বাচন</option>'+
(div?div.districts.map(d=>
`<option value="${esc(d.en)}">
${esc(d.bn)} (${esc(d.en)})
</option>`).join(""):"");

$(prefix+"Upa").innerHTML=
'<option value="">উপজেলা নির্বাচন</option>';

};


window.setUpazila=prefix=>{

const div=geo.find(
x=>x.en===$(prefix+"Div").value);

const dist=div?.districts.find(
x=>x.en===$(prefix+"Dist").value);

$(prefix+"Upa").innerHTML=
'<option value="">উপজেলা নির্বাচন</option>'+
(dist?dist.upazilas.map(u=>
`<option value="${esc(u.en)}">
${esc(u.bn)} (${esc(u.en)})
</option>`).join(""):"");

};


function getLoc(prefix){

return{
division:$(prefix+"Div").value,
district:$(prefix+"Dist").value,
upazila:$(prefix+"Upa").value
};

/* =====================================================
 DATABASE HELPERS
===================================================== */

async function addData(type,data){

if(db){

await addDoc(
collection(db,type),
data
);

}else{

const key=
type==="donors"
?"mb_demo_donors"
:"mb_demo_requests";

data.id=crypto.randomUUID();

const arr=JSON.parse(
localStorage.getItem(key)||"[]");

arr.push(data);

localStorage.setItem(
key,JSON.stringify(arr));

}

}


async function updateItem(type,id,data){

if(db){

await updateDoc(
doc(db,type,id),
data
);

}else{

const key=
type==="donors"
?"mb_demo_donors"
:"mb_demo_requests";

const arr=JSON.parse(
localStorage.getItem(key)||"[]");

const i=arr.findIndex(x=>x.id===id);

if(i>=0)arr[i]={...arr[i],...data};

localStorage.setItem(
key,JSON.stringify(arr));

}

}


async function deleteItem(type,id){

if(db){

await deleteDoc(
doc(db,type,id)
);

}else{

const key=
type==="donors"
?"mb_demo_donors"
:"mb_demo_requests";

const arr=JSON.parse(
localStorage.getItem(key)||"[]")
.filter(x=>x.id!==id);

localStorage.setItem(
key,JSON.stringify(arr));

}

}

/* =====================================================
 AUTH
===================================================== */

async function start(){

await loadGeo();

if(!firebaseReady){

$("loginError").textContent=
"Firebase Config বসানো হয়নি।";

return;

}

onAuthStateChanged(auth,async user=>{

if(!user){

$("loginPage").classList.remove("hidden");
$("adminPage").classList.add("hidden");

return;

}

if(
!user.email ||
user.email.toLowerCase()!==
ADMIN_EMAIL.toLowerCase()
){

await signOut(auth);

$("loginError").textContent=
"❌ এই Gmail Admin হিসেবে অনুমোদিত নয়।";

return;

}

$("loginPage").classList.add("hidden");
$("adminPage").classList.remove("hidden");

await loadData();

});

}

start();
