<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB Blood Bank — Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;
background:linear-gradient(135deg,#090005,#35000b,#100005);
color:white;min-height:100vh;
}
header{
padding:18px;
background:rgba(20,0,5,.8);
backdrop-filter:blur(18px);
border-bottom:1px solid #ffffff18;
}
.container{max-width:1200px;margin:auto;padding:20px}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#ff3150}
.glass{
background:#ffffff0d;
border:1px solid #ffffff16;
border-radius:22px;
backdrop-filter:blur(18px);
box-shadow:0 20px 50px #0006;
}
.login{
max-width:430px;margin:80px auto;padding:30px;
}
h1,h2{text-align:center}
input{
width:100%;padding:14px;margin:8px 0;
border-radius:12px;border:1px solid #ffffff20;
background:#14070a;color:#fff;
}
button{
border:0;border-radius:12px;padding:12px 18px;
cursor:pointer;font-weight:bold;margin:4px;
}
.loginBtn{width:100%;background:#e91e3d;color:white}
.dash{display:none}
.stats{
display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
}
.stat{padding:20px;text-align:center}
.stat strong{font-size:30px;color:#ff3c59}
.tabs{margin:20px 0;text-align:center}
.tab{
background:#321017;color:#fff;
}
.tab.active{background:#e91e3d}
.panel{display:none}
.panel.active{display:block}
table{width:100%;border-collapse:collapse}
th,td{
padding:12px;border-bottom:1px solid #ffffff15;
text-align:left;font-size:14px;
}
.approve{background:#168a45;color:#fff}
.reject{background:#a5122b;color:#fff}
.edit{background:#a66b00;color:#fff}
.delete{background:#8c1023;color:#fff}
.logout{background:#555;color:white}
.badge{
padding:5px 9px;border-radius:15px;
background:#321017;
}
@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr)}
table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">🩸 <span>MB</span> Blood Bank — Admin</div>
</div>
</header>

<div id="loginBox" class="glass login">
<h1>🔐 Admin Login</h1>

<input id="email" type="email" placeholder="Admin Gmail">
<input id="password" type="password" placeholder="Password">

<button class="loginBtn" onclick="login()">LOGIN</button>

<p id="loginMsg" style="text-align:center;color:#ff5068"></p>

</div>

<div id="dashboard" class="dash">

<div class="container">

<div style="display:flex;justify-content:space-between;align-items:center">
<h1>⚙️ Admin Dashboard</h1>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="stats">

<div class="glass stat">
<strong id="totalDonor">0</strong>
<p>Total Donor</p>
</div>

<div class="glass stat">
<strong id="pendingDonor">0</strong>
<p>Pending Donor</p>
</div>

<div class="glass stat">
<strong id="activeDonor">0</strong>
<p>Active Donor</p>
</div>

<div class="glass stat">
<strong id="bloodReq">0</strong>
<p>Blood Request</p>
</div>

</div>

<div class="tabs">
<button class="tab active" onclick="tab('donors',this)">🩸 Donors</button>
<button class="tab" onclick="tab('requests',this)">🚨 Requests</button>
</div>

<div id="donors" class="glass panel active" style="padding:15px">
<h2>🩸 Donor Management</h2>
<div id="donorTable"></div>
</div>

<div id="requests" class="glass panel" style="padding:15px">
<h2>🚨 Blood Request Management</h2>
<div id="requestTable"></div>
</div>

</div>
</div>

<script>

const ADMIN_EMAIL="mbbloodbank@gmail.com";
const ADMIN_PASSWORD="MB@12345";

let donors=JSON.parse(localStorage.getItem("mbDonors")||"[]");
let requests=JSON.parse(localStorage.getItem("mbRequests")||"[]");

function login(){

let e=document.getElementById("email").value.trim();
let p=document.getElementById("password").value;

if(e===ADMIN_EMAIL && p===ADMIN_PASSWORD){

sessionStorage.setItem("mbAdmin","true");

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

render();

}else{
document.getElementById("loginMsg").textContent="❌ Gmail অথবা Password ভুল!";
}
}

function logout(){
sessionStorage.removeItem("mbAdmin");
location.reload();
}

function tab(id,button){

document.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");
}

function approveDonor(id){
donors=donors.map(x=>
x.id==id?{...x,status:"approved"}:x
);
save();
}

function rejectDonor(id){
donors=donors.map(x=>
x.id==id?{...x,status:"rejected"}:x
);
save();
}

function deleteDonor(id){
if(confirm("এই Donor মুছে ফেলবেন?")){
donors=donors.filter(x=>x.id!=id);
save();
}
}

function approveRequest(id){
requests=requests.map(x=>
x.id==id?{...x,status:"approved"}:x
);
save();
}

function rejectRequest(id){
requests=requests.map(x=>
x.id==id?{...x,status:"rejected"}:x
);
save();
}

function deleteRequest(id){
if(confirm("এই Request মুছে ফেলবেন?")){
requests=requests.filter(x=>x.id!=id);
save();
}
}

function save(){
localStorage.setItem("mbDonors",JSON.stringify(donors));
localStorage.setItem("mbRequests",JSON.stringify(requests));
render();
}

function render(){

donors=JSON.parse(localStorage.getItem("mbDonors")||"[]");
requests=JSON.parse(localStorage.getItem("mbRequests")||"[]");

totalDonor.textContent=donors.length;
pendingDonor.textContent=
donors.filter(x=>x.status==="pending").length;
activeDonor.textContent=
donors.filter(x=>x.status==="approved").length;
bloodReq.textContent=requests.length;

renderDonors();
renderRequests();
}

function renderDonors(){

if(!donors.length){
donorTable.innerHTML="<p style='text-align:center'>কোন Donor নেই।</p>";
return;
}

let html=`
<table>
<tr>
<th>নাম</th>
<th>Blood</th>
<th>Phone</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>
</tr>`;

donors.forEach(x=>{

html+=`
<tr>
<td>${safe(x.name)}</td>
<td>🩸 ${safe(x.blood)}</td>
<td>${safe(x.phone)}</td>
<td>${safe(x.district)} / ${safe(x.upazila)}</td>
<td><span class="badge">${safe(x.status)}</span></td>
<td>

${x.status==="pending"?`
<button class="approve" onclick="approveDonor(${x.id})">✅ Approve</button>
<button class="reject" onclick="rejectDonor(${x.id})">❌ Reject</button>
`:``}

<button class="delete" onclick="deleteDonor(${x.id})">
🗑️ Delete
</button>

</td>
</tr>`;
});

html+="</table>";
donorTable.innerHTML=html;
}

function renderRequests(){

if(!requests.length){
requestTable.innerHTML="<p style='text-align:center'>কোন Request নেই।</p>";
return;
}

let html=`
<table>
<tr>
<th>Patient</th>
<th>Blood</th>
<th>Phone</th>
<th>Hospital</th>
<th>Status</th>
<th>Action</th>
</tr>`;

requests.forEach(x=>{

html+=`
<tr>
<td>${safe(x.name)}</td>
<td>🩸 ${safe(x.blood)}</td>
<td>${safe(x.phone)}</td>
<td>${safe(x.hospital)}</td>
<td><span class="badge">${safe(x.status)}</span></td>
<td>

${x.status==="pending"?`
<button class="approve"
onclick="approveRequest(${x.id})">
✅ Approve
</button>

<button class="reject"
onclick="rejectRequest(${x.id})">
❌ Reject
</button>
`:``}

<button class="delete"
onclick="deleteRequest(${x.id})">
🗑️ Delete
</button>

</td>
</tr>`;
});

html+="</table>";
requestTable.innerHTML=html;
}

function safe(value){
return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

if(sessionStorage.getItem("mbAdmin")==="true"){
loginBox.style.display="none";
dashboard.style.display="block";
render();
}

</script>

</body>
</html>
