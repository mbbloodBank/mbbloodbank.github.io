<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MB Blood Bank - Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Noto Sans Bengali",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 10% 10%,rgba(255,0,50,.18),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(255,30,50,.1),transparent 30%),
    #080b12;
    color:#fff;
}

button,
input,
select,
textarea{
    font:inherit;
}

.container{
    width:min(1200px,94%);
    margin:auto;
}

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.login-card{
    width:min(430px,100%);
    padding:35px;
    border-radius:28px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(25px);
    box-shadow:0 30px 80px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:70px;
    height:70px;
    margin:auto;
    display:grid;
    place-items:center;
    font-size:38px;
    border-radius:22px;
    background:linear-gradient(145deg,#ff354a,#a50017);
    box-shadow:0 15px 40px rgba(255,0,40,.3);
}

.logo h1{
    margin-top:15px;
}

.logo p{
    color:#999faa;
    margin-top:5px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#cfd2d9;
}

.field{
    margin-bottom:17px;
}

input{
    width:100%;
    padding:14px;
    border-radius:13px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#ff3347;
}

.btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    font-weight:900;
    color:#fff;
    background:linear-gradient(145deg,#ff3448,#a90018);
}

.error{
    color:#ff6977;
    text-align:center;
    margin-top:12px;
    min-height:20px;
}

#dashboard{
    display:none;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    padding:15px 0;
    background:rgba(8,11,18,.82);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    font-size:21px;
    font-weight:900;
}

.logout{
    width:auto;
    padding:9px 15px;
}

.stats{
    padding:30px 0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(15px);
}

.stat b{
    display:block;
    color:#ff4356;
    font-size:30px;
}

.stat span{
    color:#9ca2ae;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    width:auto;
    padding:10px 15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
}

.tab.active{
    background:#e52238;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.item{
    margin-bottom:14px;
}

.item h3{
    margin-bottom:10px;
}

.item p{
    color:#adb2bc;
    line-height:1.7;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.action{
    width:auto;
    padding:9px 13px;
    border-radius:10px;
    border:0;
    color:#fff;
    cursor:pointer;
    font-weight:800;
}

.approve{
    background:#0b9b60;
}

.reject{
    background:#d9283c;
}

.edit{
    background:#8b6b00;
}

.delete{
    background:#741526;
}

.add{
    background:#1267b1;
}

.empty{
    text-align:center;
    color:#888f9b;
    padding:30px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
}

textarea,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    background:#11151e;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
}

textarea{
    min-height:100px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full{
    grid-column:1/-1;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

@media(max-width:450px){

    .stats{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>


<!-- ==============================
     ADMIN LOGIN
================================ -->

<div class="login" id="loginPage">

<div class="login-card">

<div class="logo">

<div class="logo-icon">🩸</div>

<h1>MB Blood Bank</h1>

<p>Admin Panel</p>

</div>


<form id="loginForm">

<div class="field">

<label>Admin Gmail / Email</label>

<input
id="adminEmail"
type="email"
placeholder="admin@gmail.com"
required>

</div>


<div class="field">

<label>Password</label>

<input
id="adminPassword"
type="password"
placeholder="Password"
required>

</div>


<button class="btn">
🔐 Admin Login
</button>

<div class="error" id="loginError"></div>

</form>

</div>

</div>



<!-- ==============================
     DASHBOARD
================================ -->

<div id="dashboard">

<header>

<div class="container nav">

<div class="brand">
🩸 MB Blood Bank — Admin
</div>

<button
class="btn logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<main class="container">


<div class="stats">

<div class="card stat">
<b id="pendingDonors">0</b>
<span>Pending Donor</span>
</div>

<div class="card stat">
<b id="activeDonors">0</b>
<span>Active Donor</span>
</div>

<div class="card stat">
<b id="pendingRequests">0</b>
<span>Pending Request</span>
</div>

<div class="card stat">
<b id="approvedRequests">0</b>
<span>Approved Request</span>
</div>

</div>


<div class="tabs">

<button
class="btn tab active"
onclick="openTab('donors',this)">
👤 Donors
</button>

<button
class="btn tab"
onclick="openTab('requests',this)">
🚨 Blood Requests
</button>

<button
class="btn tab"
onclick="openTab('addDonor',this)">
➕ Add Donor
</button>

</div>


<!-- DONORS -->

<section
id="donors"
class="panel active">

<div class="card">

<h2>👤 Donor Management</h2>

<br>

<div id="donorList"></div>

</div>

</section>


<!-- REQUESTS -->

<section
id="requests"
class="panel">

<div class="card">

<h2>🚨 Blood Request Management</h2>

<br>

<div id="requestList"></div>

</div>

</section>


<!-- ADD DONOR -->

<section
id="addDonor"
class="panel">

<div class="card">

<h2>➕ নতুন Donor যোগ করুন</h2>

<br>

<form id="addDonorForm">

<div class="form-grid">

<div>
<label>নাম</label>
<input id="aName" required>
</div>

<div>
<label>ফোন</label>
<input id="aPhone" required>
</div>

<div>
<label>Blood Group</label>

<select id="aBlood" required>

<option value="">Select</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div>
<label>বিভাগ</label>
<input id="aDivision" required>
</div>

<div>
<label>জেলা</label>
<input id="aDistrict" required>
</div>

<div>
<label>উপজেলা</label>
<input id="aUpazila" required>
</div>

<div class="full">

<label>ঠিকানা</label>

<textarea id="aAddress"></textarea>

</div>

</div>

<br>

<button class="btn add">
➕ Donor Add করুন
</button>

</form>

</div>

</section>

</main>

</div>



<!-- ==============================
     EDIT MODAL
================================ -->

<div class="modal" id="editModal">

<div class="modal-box card">

<h2>✏️ Donor Edit</h2>

<br>

<form id="editForm">

<input
type="hidden"
id="editId">

<div class="field">

<label>নাম</label>

<input id="editName" required>

</div>

<div class="field">

<label>ফোন</label>

<input id="editPhone" required>

</div>

<div class="field">

<label>Blood Group</label>

<select id="editBlood">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="field">

<label>বিভাগ</label>

<input id="editDivision">

</div>

<div class="field">

<label>জেলা</label>

<input id="editDistrict">

</div>

<div class="field">

<label>উপজেলা</label>

<input id="editUpazila">

</div>

<div class="field">

<label>ঠিকানা</label>

<textarea id="editAddress"></textarea>

</div>

<div class="actions">

<button class="action approve">
Save
</button>

<button
type="button"
class="action reject"
onclick="closeModal()">
Cancel
</button>

</div>

</form>

</div>

</div>



<script>

/* ==================================
   ADMIN CONFIGURATION
================================== */

/*
   DEMO LOGIN

   Production website-এ এগুলো
   HTML/JavaScript-এর মধ্যে রাখা যাবে না।

   Firebase/Supabase/backend authentication
   ব্যবহার করতে হবে।
*/

const ADMIN_EMAIL =
"admin@gmail.com";

const ADMIN_PASSWORD =
"MBBlood@2026";


/* ==================================
   LOGIN
================================== */

document.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const email=
        document.getElementById("adminEmail").value;

    const password=
        document.getElementById("adminPassword").value;

    if(
        email===ADMIN_EMAIL &&
        password===ADMIN_PASSWORD
    ){

        sessionStorage.setItem(
            "mb_admin_login",
            "true"
        );

        showDashboard();

    }else{

        document.getElementById("loginError")
        .textContent=
        "❌ Email অথবা Password ভুল।";

    }

});


function showDashboard(){

    document.getElementById("loginPage")
        .style.display="none";

    document.getElementById("dashboard")
        .style.display="block";

    renderAll();

}


function logout(){

    sessionStorage.removeItem(
        "mb_admin_login"
    );

    location.reload();

}


if(
    sessionStorage.getItem("mb_admin_login")
    ==="true"
){

    showDashboard();

}


/* ==================================
   STORAGE
================================== */

function getData(key){

    return JSON.parse(
        localStorage.getItem(key)||"[]"
    );

}

function saveData(key,data){

    localStorage.setItem(
        key,
        JSON.stringify(data)
    );

}


/* ==================================
   TABS
================================== */

function openTab(id,button){

    document
    .querySelectorAll(".panel")
    .forEach(p=>
        p.classList.remove("active")
    );

    document
    .querySelectorAll(".tab")
    .forEach(b=>
        b.classList.remove("active")
    );

    document
    .getElementById(id)
    .classList.add("active");

    button.classList.add("active");

}


/* ==================================
   STATS
================================== */

function updateStats(){

    const donors=getData("mb_donors");

    const requests=getData("mb_requests");

    document.getElementById("pendingDonors")
    .textContent=
    donors.filter(
        d=>d.status==="pending"
    ).length;

    document.getElementById("activeDonors")
    .textContent=
    donors.filter(
        d=>d.status==="approved"
    ).length;

    document.getElementById("pendingRequests")
    .textContent=
    requests.filter(
        r=>r.status==="pending"
    ).length;

    document.getElementById("approvedRequests")
    .textContent=
    requests.filter(
        r=>r.status==="approved"
    ).length;

}


/* ==================================
   DONOR LIST
================================== */

function renderDonors(){

    const donors=getData("mb_donors");

    const box=
        document.getElementById("donorList");

    if(!donors.length){

        box.innerHTML=
        '<div class="empty">কোনো Donor নেই।</div>';

        return;

    }

    box.innerHTML=donors.map(d=>`

        <div class="card item">

        <h3>
        🩸 ${escapeHTML(d.name)}
        </h3>

        <p>
        Blood: <b>${escapeHTML(d.blood)}</b>
        </p>

        <p>
        📞 ${escapeHTML(d.phone)}
        </p>

        <p>
        📍 ${escapeHTML(d.division)}
        /
        ${escapeHTML(d.district)}
        /
        ${escapeHTML(d.upazila)}
        </p>

        <p>
        Status:
        <b>${escapeHTML(d.status)}</b>
        </p>

        <div class="actions">

        ${
        d.status!=="approved"
        ?
        `<button
        class="action approve"
        onclick="approveDonor(${d.id})">
        ✅ Approve
        </button>`
        :""
        }

        ${
        d.status!=="rejected"
        ?
        `<button
        class="action reject"
        onclick="rejectDonor(${d.id})">
        ❌ Reject
        </button>`
        :""
        }

        <button
        class="action edit"
        onclick="editDonor(${d.id})">
        ✏️ Edit
        </button>

        <button
        class="action delete"
        onclick="deleteDonor(${d.id})">
        🗑️ Delete
        </button>

        </div>

        </div>

    `).join("");

}


/* ==================================
   DONOR ACTIONS
================================== */

function approveDonor(id){

    const donors=getData("mb_donors");

    const donor=donors.find(
        d=>d.id===id
    );

    if(donor){

        donor.status="approved";

        saveData(
            "mb_donors",
            donors
        );

        renderAll();

    }

}


function rejectDonor(id){

    const donors=getData("mb_donors");

    const donor=donors.find(
        d=>d.id===id
    );

    if(donor){

        donor.status="rejected";

        saveData(
            "mb_donors",
            donors
        );

        renderAll();

    }

}


function deleteDonor(id){

    if(!confirm(
        "এই Donor মুছে ফেলবেন?"
    ))return;

    let donors=getData("mb_donors");

    donors=donors.filter(
        d=>d.id!==id
    );

    saveData(
        "mb_donors",
        donors
    );

    renderAll();

}


/* ==================================
   EDIT DONOR
================================== */

function editDonor(id){

    const donors=getData("mb_donors");

    const donor=donors.find(
        d=>d.id===id
    );

    if(!donor)return;

    document.getElementById("editId")
        .value=id;

    document.getElementById("editName")
        .value=donor.name;

    document.getElementById("editPhone")
        .value=donor.phone;

    document.getElementById("editBlood")
        .value=donor.blood;

    document.getElementById("editDivision")
        .value=donor.division;

    document.getElementById("editDistrict")
        .value=donor.district;

    document.getElementById("editUpazila")
        .value=donor.upazila;

    document.getElementById("editAddress")
        .value=donor.address||"";

    document.getElementById("editModal")
        .classList.add("show");

}


function closeModal(){

    document.getElementById("editModal")
        .classList.remove("show");

}


document.getElementById("editForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const id=
        Number(
            document.getElementById("editId").value
        );

    const donors=getData("mb_donors");

    const donor=donors.find(
        d=>d.id===id
    );

    if(!donor)return;

    donor.name=
        document.getElementById("editName").value;

    donor.phone=
        document.getElementById("editPhone").value;

    donor.blood=
        document.getElementById("editBlood").value;

    donor.division=
        document.getElementById("editDivision").value;

    donor.district=
        document.getElementById("editDistrict").value;

    donor.upazila=
        document.getElementById("editUpazila").value;

    donor.address=
        document.getElementById("editAddress").value;

    saveData(
        "mb_donors",
        donors
    );

    closeModal();

    renderAll();

});


/* ==================================
   REQUEST LIST
================================== */

function renderRequests(){

    const requests=
        getData("mb_requests");

    const box=
        document.getElementById("requestList");

    if(!requests.length){

        box.innerHTML=
        '<div class="empty">কোনো Blood Request নেই।</div>';

        return;

    }

    box.innerHTML=requests.map(r=>`

        <div class="card item">

        <h3>
        🚨 ${escapeHTML(r.patient)}
        </h3>

        <p>
        🩸 Blood:
        <b>${escapeHTML(r.blood)}</b>
        </p>

        <p>
        🩸 Bags:
        ${escapeHTML(r.bags)}
        </p>

        <p>
        📞 ${escapeHTML(r.phone)}
        </p>

        <p>
        🏥 ${escapeHTML(r.hospital)}
        </p>

        <p>
        📍 ${escapeHTML(r.division)}
        /
        ${escapeHTML(r.district)}
        /
        ${escapeHTML(r.upazila)}
        </p>

        <p>
        📅 ${escapeHTML(r.date)}
        </p>

        <p>
        🚨 জরুরিতা:
        <b>${escapeHTML(r.urgency)}</b>
        </p>

        <p>
        Status:
        <b>${escapeHTML(r.status)}</b>
        </p>

        <div class="actions">

        ${
        r.status!=="approved"
        ?
        `<button
        class="action approve"
        onclick="approveRequest(${r.id})">
        ✅ Request Approve
        </button>`
        :""
        }

        ${
        r.status!=="rejected"
        ?
        `<button
        class="action reject"
        onclick="rejectRequest(${r.id})">
        ❌ Request Reject
        </button>`
        :""
        }

        <button
        class="action delete"
        onclick="deleteRequest(${r.id})">
        🗑️ Delete
        </button>

        </div>

        </div>

    `).join("");

}


/* ==================================
   REQUEST ACTIONS
================================== */

function approveRequest(id){

    const requests=
        getData("mb_requests");

    const request=
        requests.find(
            r=>r.id===id
        );

    if(request){

        request.status="approved";

        saveData(
            "mb_requests",
            requests
        );

        renderAll();

    }

}


function rejectRequest(id){

    const requests=
        getData("mb_requests");

    const request=
        requests.find(
            r=>r.id===id
        );

    if(request){

        request.status="rejected";

        saveData(
            "mb_requests",
            requests
        );

        renderAll();

    }

}


function deleteRequest(id){

    if(!confirm(
        "এই Blood Request মুছে ফেলবেন?"
    ))return;

    let requests=
        getData("mb_requests");

    requests=requests.filter(
        r=>r.id!==id
    );

    saveData(
        "mb_requests",
        requests
    );

    renderAll();

}


/* ==================================
   ADD DONOR
================================== */

document.getElementById("addDonorForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const donors=
        getData("mb_donors");

    donors.push({

        id:Date.now(),

        name:
        document.getElementById("aName").value,

        phone:
        document.getElementById("aPhone").value,

        blood:
        document.getElementById("aBlood").value,

        division:
        document.getElementById("aDivision").value,

        district:
        document.getElementById("aDistrict").value,

        upazila:
        document.getElementById("aUpazila").value,

        address:
        document.getElementById("aAddress").value,

        status:"approved",

        created:new Date().toISOString()

    });

    saveData(
        "mb_donors",
        donors
    );

    this.reset();

    renderAll();

    alert(
        "✅ Donor সফলভাবে যোগ করা হয়েছে।"
    );

});


/* ==================================
   SECURITY
================================== */

function escapeHTML(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==================================
   RENDER
================================== */

function renderAll(){

    updateStats();

    renderDonors();

    renderRequests();

}

</script>

</body>
</html>
