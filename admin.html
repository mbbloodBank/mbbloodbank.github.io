<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MB Blood Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #333;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb, #90caf9);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .login-container, .admin-dashboard {
            max-width: 900px;
            margin: 40px auto;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        h2 {
            color: var(--primary-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 12px;
            background: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        th {
            background: var(--primary);
            color: #fff;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-approve {
            background: #2e7d32;
            color: #fff;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-reject {
            background: #c62828;
            color: #fff;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Admin Login Section -->
    <div class="login-container" id="login-box">
        <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
        <div class="form-group">
            <label>Gmail / Admin Email</label>
            <input type="email" id="admin-email" placeholder="mbbloodbank@gmail.com" value="mbbloodbank@gmail.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড দিন">
        </div>
        <button class="btn" onclick="adminLogin()">লগইন করুন</button>
    </div>

    <!-- Admin Dashboard Section -->
    <div class="admin-dashboard hidden" id="dashboard-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fa-solid fa-gears"></i> Admin Control Panel</h2>
            <button class="btn" style="width: auto; background: #555;" onclick="adminLogout()">লগআউট</button>
        </div>

        <!-- Pending Donor Requests -->
        <h3 style="margin-top: 20px; color: #333;"><i class="fa-solid fa-user-clock"></i> পেন্ডিং ডোনার রিকোয়েস্ট</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>গ্রুপ</th>
                        <th>মোবাইল</th>
                        <th>ঠিকানা</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="pending-donors-list">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>

        <!-- Emergency Blood Requests -->
        <h3 style="margin-top: 30px; color: #333;"><i class="fa-solid fa-triangle-exclamation"></i> রক্তের জরুরি অনুরোধসমূহ</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>রোগী</th>
                        <th>গ্রুপ</th>
                        <th>ব্যাগ</th>
                        <th>হাসপাতাল</th>
                        <th>মোবাইল</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="blood-req-list">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "mbbloodbank@gmail.com";
        const ADMIN_PASS = "mb123456"; // আপনার ইচ্ছামতো পাসওয়ার্ড পরিবর্তন করতে পারেন

        function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;

            if(email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                alert('ভুল জিমেইল বা পাসওয়ার্ড!');
            }
        }

        function showDashboard() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dashboard-box').classList.remove('hidden');
            loadAdminData();
        }

        function adminLogout() {
            localStorage.removeItem('isAdminLoggedIn');
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('dashboard-box').classList.add('hidden');
        }

        function loadAdminData() {
            // Load Pending Donors
            const pending = JSON.parse(localStorage.getItem('pendingDonors') || '[]');
            const pendingTbody = document.getElementById('pending-donors-list');
            pendingTbody.innerHTML = '';
            if(pending.length === 0) {
                pendingTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো পেন্ডিং রিকোয়েস্ট নেই</td></tr>';
            } else {
                pending.forEach((d, index) => {
                    pendingTbody.innerHTML += `<tr>
                        <td>${d.name}</td>
                        <td><strong>${d.group}</strong></td>
                        <td>${d.phone}</td>
                        <td>${d.address}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-approve" onclick="approveDonor(${index})"><i class="fa-solid fa-check"></i> Approve</button>
                                <button class="btn-reject" onclick="rejectDonor(${index})"><i class="fa-solid fa-xmark"></i> Reject</button>
                            </div>
                        </td>
                    </tr>`;
                });
            }

            // Load Blood Requests
            const requests = JSON.parse(localStorage.getItem('bloodRequests') || '[]');
            const reqTbody = document.getElementById('blood-req-list');
            reqTbody.innerHTML = '';
            if(requests.length === 0) {
                reqTbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">কোনো রক্তের অনুরোধ নেই</td></tr>';
            } else {
                requests.forEach((r, index) => {
                    reqTbody.innerHTML += `<tr>
                        <td>${r.patient}</td>
                        <td><strong>${r.group}</strong></td>
                        <td>${r.bags} ব্যাগ</td>
                        <td>${r.hospital}</td>
                        <td>${r.contact}</td>
                        <td>
                            <button class="btn-reject" onclick="deleteRequest(${index})"><i class="fa-solid fa-trash"></i> মুছুন</button>
                        </td>
                    </tr>`;
                });
            }
        }

        function approveDonor(index) {
            let pending = JSON.parse(localStorage.getItem('pendingDonors') || '[]');
            let approved = JSON.parse(localStorage.getItem('approvedDonors') || '[]');
            
            const donor = pending.splice(index, 1)[0];
            donor.status = 'Approved';
            approved.push(donor);

            localStorage.setItem('pendingDonors', JSON.stringify(pending));
            localStorage.setItem('approvedDonors', JSON.stringify(approved));
            loadAdminData();
            alert('ডোনার সফলভাবে অ্যাপ্রুভ করা হয়েছে!');
        }

        function rejectDonor(index) {
            let pending = JSON.parse(localStorage.getItem('pendingDonors') || '[]');
            pending.splice(index, 1);
            localStorage.setItem('pendingDonors', JSON.stringify(pending));
            loadAdminData();
            alert('ডোনার রিকোয়েস্ট বাতিল (Reject) করা হয়েছে।');
        }

        function deleteRequest(index) {
            let requests = JSON.parse(localStorage.getItem('bloodRequests') || '[]');
            requests.splice(index, 1);
            localStorage.setItem('bloodRequests', JSON.stringify(requests));
            loadAdminData();
        }

        window.onload = function() {
            if(localStorage.getItem('isAdminLoggedIn') === 'true') {
                showDashboard();
            }
        }
    </script>
</body>
</html>
