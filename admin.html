<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>MB Blood Bank | Admin Panel</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Hind Siliguri',sans-serif;
background:#050507;
color:#fff;
min-height:100vh;
}

/* LOGIN */

.loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

background:
radial-gradient(circle at 20% 20%,rgba(255,0,60,.2),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(100,0,30,.2),transparent 35%),
#050507;
}

.loginBox{
width:100%;
max-width:430px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(25px);

box-shadow:
0 30px 100px rgba(0,0,0,.5),
inset 0 1px rgba(255,255,255,.1);
}

.loginLogo{
text-align:center;
font-size:32px;
font-weight:700;
margin-bottom:10px;
}

.loginLogo span{
color:#ff1744;
}

.loginSub{
text-align:center;
color:#999;
margin-bottom:25px;
}

label{
display:block;
color:#ccc;
margin:14px 0 7px;
}

input{
width:100%;
padding:15px;

border-radius:14px;
border:1px solid rgba(255,255,255,.1);

background:#110b0e;
color:#fff;

outline:none;
}

input:focus{
border-color:#ff1744;
}

.loginBtn{
width:100%;
padding:15px;
margin-top:20px;

border:0;
border-radius:15px;

background:linear-gradient(135deg,#ff1744,#82001d);

color:#fff;

font-family:inherit;
font-weight:700;
font-size:16px;

cursor:pointer;
}

/* DASHBOARD */

.dashboard{
display:none;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:100;

height:72px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 22px;

background:rgba(10,7,9,.85);
border-bottom:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);
}

.logo{
font-size:22px;
font-weight:700;
}

.logo span{
color:#ff1744;
}

.logout{
border:0;
padding:11px 18px;

border-radius:12px;

background:#2a1118;
color:#fff;

cursor:pointer;
}

/* CONTAINER */

.container{
max-width:1250px;
margin:auto;
padding:25px;
}

/* STAT CARDS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:25px;
}

.card{
background:
linear-gradient(
135deg,
rgba(255,255,255,.08),
rgba(255,255,255,.025)
);

border:1px solid rgba(255,255,255,.09);
border-radius:23px;

padding:23px;

backdrop-filter:blur(20px);

box-shadow:
0 20px 60px rgba(0,0,0,.25),
inset 0 1px rgba(255,255,255,.08);
}

.statIcon{
font-size:28px;
margin-bottom:8px;
}

.statNumber{
font-size:38px;
font-weight:700;
color:#ff1744;
}

.statText{
color:#aaa;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.tab{
padding:13px 18px;

border:1px solid rgba(255,255,255,.08);
border-radius:13px;

background:#180c11;
color:#fff;

font-family:inherit;
cursor:pointer;
}

.tab.active{
background:#ff1744;
}

/* PANEL */

.panel{
display:none;
}

.panel.active{
display:block;
}

.panelTitle{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
}

/* TABLE */

.tableWrap{
overflow:auto;
border-radius:18px;
}

table{
width:100%;
min-width:850px;
border-collapse:collapse;
}

th,
td{
padding:14px 12px;
border-bottom:1px solid rgba(255,255,255,.07);
text-align:left;
}

th{
color:#ff6179;
font-weight:600;
}

td{
color:#ddd;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:30px;
font-size:13px;
background:#261019;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
}

button{
font-family:inherit;
}

.approve,
.reject,
.delete,
.edit{
border:0;
padding:8px 11px;
border-radius:10px;
color:#fff;
cursor:pointer;
}

.approve{
background:#a9002b;
}

.reject{
background:#4c1825;
}

.delete{
background:#261014;
color:#ff7187;
}

.edit{
background:#47202b;
}

/* MOBILE */

@media(max-width:900px){

.stats{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

header{
padding:0 13px;
}

.container{
padding:15px;
}

.stats{
grid-template-columns:1fr;
}

.loginBox{
padding:25px;
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="loginPage" id="loginPage">

<div class="loginBox">

<div class="loginLogo">
🩸 MB <span>Blood Bank</span>
</div>

<div class="loginSub">
Secure Admin Panel
</div>

<label>Admin Email</label>

<input
id="adminEmail"
type="email"
placeholder="Admin Email">

<label>Password</label>

<input
id="adminPassword"
type="password"
placeholder="Password">

<button
class="loginBtn"
onclick="adminLogin()">

🔐 Admin Login

</button>

<p
id="loginError"
style="color:#ff4c6c;text-align:center;margin-top:15px">
</p>

</div>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<header>

<div class="logo">
🩸 MB <span>Blood Bank</span>
</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</header>


<div class="container">

<!-- STATS -->

<div class="stats">

<div class="card">

<div class="statIcon">👤</div>

<div
class="statNumber"
id="totalDonors">
0
</div>

<div class="statText">
Total Donor
</div>

</div>


<div class="card">

<div class="statIcon">⏳</div>

<div
class="statNumber"
id="pendingDonors">
0
</div>

<div class="statText">
Pending Donor
</div>

</div>


<div class="card">

<div class="statIcon">🩸</div>

<div
class="statNumber"
id="activeDonors">
0
</div>

<div class="statText">
Active Donor
</div>

</div>


<div class="card">

<div class="statIcon">🚨</div>

<div
class="statNumber"
id="totalRequests">
0
</div>

<div class="statText">
Blood Requests
</div>

</div>

</div>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
onclick="openPanel('donorPanel',this)">

👤 Donor Management

</button>

<button
class="tab"
onclick="openPanel('requestPanel',this)">

🚨 Blood Requests

</button>

</div>


<!-- DONOR PANEL -->

<div
class="card panel active"
id="donorPanel">

<div class="panelTitle">

<h2>
👤 Donor Management
</h2>

</div>

<div class="tableWrap">

<table>

<thead>

<tr>

<th>Name</th>
<th>Phone</th>
<th>Blood</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="donorTable">

</tbody>

</table>

</div>

</div>


<!-- REQUEST PANEL -->

<div
class="card panel"
id="requestPanel">

<div class="panelTitle">

<h2>
🚨 Blood Request Management
</h2>

</div>

<div class="tableWrap">

<table>

<thead>

<tr>

<th>Patient</th>
<th>Phone</th>
<th>Blood</th>
<th>Bags</th>
<th>Location</th>
<th>Urgency</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="requestTable">

</tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* ADMIN LOGIN */

const ADMIN_EMAIL="admin@gmail.com";
const ADMIN_PASSWORD="MBBlood@2026";


function adminLogin(){

let email=
document.getElementById("adminEmail").value;

let password=
document.getElementById("adminPassword").value;


if(
email===ADMIN_EMAIL &&
password===ADMIN_PASSWORD
){

sessionStorage.setItem(
"mbAdminLogin",
"true"
);

showDashboard();

}else{

document.getElementById("loginError")
.textContent=
"❌ Email অথবা Password ভুল!";

}

}


function showDashboard(){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

loadAll();

}


function logout(){

sessionStorage.removeItem(
"mbAdminLogin"
);

location.reload();

}


if(
sessionStorage.getItem("mbAdminLogin")
==="true"
){

showDashboard();

}


/* STORAGE */

function getDonors(){

return JSON.parse(
localStorage.getItem("mbDonors") || "[]"
);

}

function saveDonors(data){

localStorage.setItem(
"mbDonors",
JSON.stringify(data)
);

}


function getRequests(){

return JSON.parse(
localStorage.getItem("mbRequests") || "[]"
);

}

function saveRequests(data){

localStorage.setItem(
"mbRequests",
JSON.stringify(data)
);

}


/* DASHBOARD */

function loadAll(){

let donors=getDonors();
let requests=getRequests();

document.getElementById("totalDonors")
.textContent=donors.length;

document.getElementById("pendingDonors")
.textContent=
donors.filter(
x=>x.status==="Pending"
).length;

document.getElementById("activeDonors")
.textContent=
donors.filter(
x=>x.status==="Approved"
).length;

document.getElementById("totalRequests")
.textContent=
requests.length;

renderDonors();
renderRequests();

}


/* DONOR TABLE */

function renderDonors(){

let donors=getDonors();

let table=
document.getElementById("donorTable");

table.innerHTML="";


if(!donors.length){

table.innerHTML=`
<tr>
<td colspan="6">
কোনো Donor Registration নেই।
</td>
</tr>
`;

return;

}


donors.forEach((d,i)=>{

let action="";

if(d.status==="Pending"){

action=`

<button
class="approve"
onclick="approveDonor(${i})">

Approve

</button>

<button
class="reject"
onclick="rejectDonor(${i})">

Reject

</button>

`;

}else{

action=`

<button
class="edit"
onclick="editDonor(${i})">

Edit

</button>

`;

}


action+=`

<button
class="delete"
onclick="deleteDonor(${i})">

Delete

</button>

`;


table.innerHTML+=`

<tr>

<td>${d.name}</td>

<td>${d.phone}</td>

<td>
<strong style="color:#ff1744">
${d.blood}
</strong>
</td>

<td>
${d.district || ""}<br>
<small>${d.upazila || ""}</small>
</td>

<td>
<span class="status">
${d.status}
</span>
</td>

<td>

<div class="actions">

${action}

</div>

</td>

</tr>

`;

});

}


/* APPROVE */

function approveDonor(i){

let donors=getDonors();

donors[i].status="Approved";

saveDonors(donors);

loadAll();

alert(
"✅ Donor Approved!\n\nএখন Public website-এ Donor দেখা যাবে।"
);

}


/* REJECT */

function rejectDonor(i){

let donors=getDonors();

donors[i].status="Rejected";

saveDonors(donors);

loadAll();

}


/* DELETE */

function deleteDonor(i){

if(
!confirm("এই Donor Delete করতে চান?")
)return;

let donors=getDonors();

donors.splice(i,1);

saveDonors(donors);

loadAll();

}


/* EDIT */

function editDonor(i){

let donors=getDonors();

let name=prompt(
"Donor Name:",
donors[i].name
);

if(name===null)return;

let phone=prompt(
"Phone:",
donors[i].phone
);

if(phone===null)return;

donors[i].name=name;
donors[i].phone=phone;

saveDonors(donors);

loadAll();

}


/* REQUEST TABLE */

function renderRequests(){

let requests=getRequests();

let table=
document.getElementById("requestTable");

table.innerHTML="";


if(!requests.length){

table.innerHTML=`
<tr>
<td colspan="8">
কোনো Blood Request নেই।
</td>
</tr>
`;

return;

}


requests.forEach((r,i)=>{

table.innerHTML+=`

<tr>

<td>${r.patient}</td>

<td>${r.phone}</td>

<td>
<strong style="color:#ff1744">
${r.blood}
</strong>
</td>

<td>${r.bags}</td>

<td>
${r.district || ""}<br>
<small>${r.upazila || ""}</small>
</td>

<td>${r.urgency}</td>

<td>
<span class="status">
${r.status}
</span>
</td>

<td>

<div class="actions">

<button
class="approve"
onclick="approveRequest(${i})">

Approve

</button>

<button
class="reject"
onclick="rejectRequest(${i})">

Reject

</button>

<button
class="delete"
onclick="deleteRequest(${i})">

Delete

</button>

</div>

</td>

</tr>

`;

});

}


/* REQUEST APPROVE */

function approveRequest(i){

let requests=getRequests();

requests[i].status="Approved";

saveRequests(requests);

loadAll();

}


/* REQUEST REJECT */

function rejectRequest(i){

let requests=getRequests();

requests[i].status="Rejected";

saveRequests(requests);

loadAll();

}


/* REQUEST DELETE */

function deleteRequest(i){

if(
!confirm("এই Blood Request Delete করবেন?")
)return;

let requests=getRequests();

requests.splice(i,1);

saveRequests(requests);

loadAll();

}


/* TABS */

function openPanel(id,button){

document.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

}

</script>

</body>
</html>
