  padding:0;
}

body{

}

  color:#d90429;

}

.header p{

}

/* FILE BOX */

.file-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(15,23,42,.08);
  margin-bottom:25px;
}

.file-header{
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  background:linear-gradient(135deg,#fff,#fff5f7);
  border-bottom:1px solid #eee;
}

.file-name{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:bold;
}

.file-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#d90429;
  color:white;
}

.arrow{
  font-size:22px;
  color:#d90429;
  transition:.3s;
}

.file-box.open .arrow{
  transform:rotate(180deg);
}

/* CODE */

.code-area{
  display:none;
  background:#101522;
  position:relative;
}

.file-box.open .code-area{
  display:block;
}

.code-toolbar{
  display:flex;
  gap:10px;
  padding:12px;
  background:#171d2b;
  border-bottom:1px solid #303747;
}

.tool-btn{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:bold;
  color:white;
  background:#d90429;
}

.tool-btn:hover{
  opacity:.9;
}

.code{
  margin:0;
  padding:20px;
  overflow:auto;
  max-height:550px;
  color:#e5e7eb;
  font-family:monospace;
  font-size:13px;
  line-height:1.65;
  white-space:pre;
}

/* PREVIEW */

.preview-title{
  margin:30px 0 15px;
  font-size:24px;
  font-weight:bold;
}

.preview-box{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e5e7eb;
  box-shadow:0 15px 40px rgba(15,23,42,.08);
}

.preview-header{
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid #eee;
}

.preview-header strong{
  color:#d90429;
}

.live-dot{
  display:flex;
  align-items:center;
  gap:7px;
  color:#16a34a;
  font-size:14px;
  font-weight:bold;
}

.live-dot span{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#16a34a;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

iframe{
  width:100%;
  height:700px;
  border:0;
  display:block;
}

document.getElementById(

/* ====================================================
   LIVE PREVIEW
===================================================== */

const preview =
document.getElementById("preview");

preview.srcdoc = indexHTML;


/* ====================================================
   OPEN / CLOSE CODE
===================================================== */

function toggleCode(){

  document
    .getElementById("fileBox")
    .classList.toggle("open");

}


/* ====================================================
   COPY
===================================================== */

function copyCode(event){

  event.stopPropagation();

  navigator.clipboard.writeText(indexHTML)
  .then(()=>{

    alert("✅ index.html কোড কপি হয়েছে!");

  })
  .catch(()=>{

    alert("কপি করা যায়নি।");

  });

}


/* ====================================================
   DOWNLOAD
===================================================== */

function downloadCode(event){

  event.stopPropagation();

  const blob =
    new Blob(
      [indexHTML],
      {type:"text/html"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = "index.html";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}
